<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Mark's the Spot</title>
</head>
<body>
    <header>
        <section id="nav-placeholder"></section>
    </header>

    <main>
        <section class="upload-section">
            <div class="img-upload">
                <h2>Upload your Design</h2>
                <input type="file" name="image" accept="image/jpeg, image/png, image/jpg">
                <button type="submit">Convert to Stencil</button>
            </div>
        </section>

        <section class="flash-wall">
            <h2>Flash Wall</h2>
                <div class="flash-imgs">
                    <div class="flash-card">
                        <img src="flash1.jpg" alt="Flash 1">
                    </div>
                    <div class="flash-card">
                        <img src="flash2.jpg" alt="Flash 2">
                    </div>
                    <div class="flash-card">
                        <img src="flash3.jpg" alt="Flash 3">
                    </div>
                </div>
        </section>

</body>
</html>

<body>
    <header>

    <nav>

    <main>
        <section class="upload-section">
            <div class="img-upload">
                <h2>Upload your Design</h2>

                <div class="comparisonSection" id="drop-area">
                    <div class="comparisonImage beforeImage" id="img-view">
                        <img id="uploadIcon" src="./assets/upload.png" alt="before">
                        <p id="uploadHint">Drag and drop or click here to upload your design</p>
                        <label for="input-file" class="upload-overlay">
                            <input type="file" id="input-file" accept="image/jpeg, image/png, image/jpg" hidden>
                        </label>
                    </div>

                    <div class="comparisonImage afterImage" id="afterLayer">
                        <img id="afterImg" src="" alt="after">
                    </div>
                </div>

                <button type="button" id="removeBgBtn" disabled>Convert to Stencil</button>
                <h4 class="header-section">Scroll to see the before/after</h4>
                <a href="./try-on.html" id="tryOnBtn" style="display: none;">Try On</a>
            </div>
        </section>


        <section class="flash-wall">
            <h2>Flash Wall</h2>
            <div class="gallery">
                <div class="item" data-title="Placeholder title" data-description="Placeholder description">
                    <img src="./assets/Flash/84eaeff0-e8ae-4ea1-9b30-1fad08c1db66.png" alt="">
                </div>

                <div class="item" data-title="Placeholder title" data-description="Placeholder description">

                <div class="item" data-title="Placeholder title" data-description="Placeholder description">
                    <img src="https://picsum.photos/seed/129/600/600" alt="">

                <div class="item" data-title="Placeholder title" data-description="Placeholder description">
                    <img src="https://picsum.photos/seed/139/600/600" alt="">

            </div>

            <div class="detail">
                <img />

                    <div class="title">Placeholder title</div>

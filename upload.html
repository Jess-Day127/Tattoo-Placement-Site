<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Mark's the Spot</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon 2.png">
    <link rel="stylesheet" href="./css/style.css">
    
</head>
<body>
    <header>
        
    </header>

    <nav>
        <ul class="nav-links">
            <li><a href="./index.html">Home</a></li>
            <li><a href="/">Upload Design</a></li>
            <li><a href="./try-on.html">Try-on</a></li>
        </ul>
    </nav>

    <main>
        <section class="upload-section">
            <div class="img-upload">
                <h2>Upload your Design</h2>
                <label for="input-file" id="drop-area">
                    <input type="file" id="input-file" accept="image/jpeg, image/png, image/jpg" hidden>

                    <div id="img-view">
                        <img src="./assets/upload.png" alt="">
                        <p>Drag and drop or click here to upload your design</p>
                    </div>
                </label>

                <button type="button" id="removeBgBtn" disabled>Remove Background</button>
            </div>
        </section>



        <section class="flash-wall">
            <h2>Flash Wall</h2>
                <div class="flash-imgs">
                    <div class="flash-card">
                        <img src="flash1.jpg" alt="Flash 1">
                    </div>
                    <div class="flash-card">
                        <img src="flash2.jpg" alt="Flash 2">
                    </div>
                    <div class="flash-card">
                        <img src="flash3.jpg" alt="Flash 3">
                    </div>
                </div>
        </section>

    </main>

    <script src="./javascript/main.js" defer></script>

</body>
</html>

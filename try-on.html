<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try-On</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon 2.png">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <nav>
        <ul class="nav-links">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./upload.html">Upload Design</a></li>
            <li><a href="/">Try-on</a></li>
        </ul>
    </nav>

<main id="content">

    <section class="left-column">
        <div class="transform-tools">
            <h2>Transform</h2>
            <input type="range" min="-500" max="500" value="0" class="slider" id="posX">
            <input type="range" min="-500" max="500" value="0" class="slider" id="posY">
        </div>

        <div class="rotation-tools">
            <h2>Rotation</h2>
            <input type="range" min="-180" max="180" value="0" class="slider" id="rotSlider">
        </div>

        <div class="scale-tools">
            <h2>Scale</h2>
            <input type="range" min="40" max="1127" value="220" class="slider" id="scaleSlider">
        </div>

        <div class="flip-tools">
            <h2>Flip</h2>
            <button id="flipHBtn">Flip ↔</button>
        </div>

        <div class="transp-tools">
            <h2>Transparency</h2>
            <input type="range" min="0" max="100" value="100" class="slider" id="opacitySlider">
            <span id="opacityValue">100%</span>
        </div>

        <div class="undo-redo">
            <h2>Undo/Redo</h2>
            <button id="undo-button">Undo</button>
            <button id="redo-button">Redo</button>
            <button id="resetStencilBtn">Reset Stencil</button>
        </div>
    </section>

    <section class="try-on-container">
        <div class="try-on-area">
            <div class="body-wrap">
                <img id="imgBodyArea" alt="Body area">
                <img id="imgPainOverlay" alt="Pain map" aria-hidden="true">
            </div>

            <div class="stencil-box" id="stencilBox">
                <div id="stencilClip">
                    <img id="imgStencil" alt="Your design">
                </div>
                <div class="resize-handle" id="resizeHandle"></div>
                <div class="rotate-handle" id="rotateHandle"></div>
            </div>
        </div>
    </section>

    <section class="right-column">
        <div class="body-area-dropdown">
            <h2>Select Body Area</h2>
            <img src="" alt="Select Body Area" id="imgBodyAreaPreview">
            <select id="body-area-select" onchange="changeBodyArea(this.value)">
                <option value="head">Head</option>
                <option value="throat">Throat</option>
                <option value="ear">Ear</option>
                <option value="torso">Torso</option>
                <option value="ribs">Ribs</option>
                <option value="back">Back</option>
                <option value="armInside">Arm Inside</option>
                <option value="armOutside">Arm Outside</option>
                <option value="knuckles">Knuckles</option>
                <option value ="hip">Hip</option>
                <option value="legSide">Leg Side</option>
                <option value="legFront">Leg Front</option>
                <option value="legBack">Leg Back</option>
            </select>
        </div>

        <div class="skin-tone">
            <h2>Skin Tone</h2>
            <button onclick="changeSkinTone('greyscale')">Default</button>
            <button onclick="changeSkinTone('light')">Light</button>
            <button onclick="changeSkinTone('medium')">Medium</button>
            <button onclick="changeSkinTone('dark')">Dark</button>
        </div>

        <div class="body-type">
            <h2>Body Type</h2>
            <button onclick="changeBodyType('1')">1</button>
            <button onclick="changeBodyType('2')">2</button>
            <button onclick="changeBodyType('3')">3</button>
        </div>

        <div class="pain-overlay">
            <h2>Pain Map</h2>
            <label class="switch">
                <input type="checkbox" id="painToggle">
                <span class="slider round"></span>
            </label>
        </div>

        <div class="export-tools">
            <h2>Export / Share</h2>
            <button id="downloadBtn">Download PNG</button>
            <button id="shareBtn">Share Design</button>
            <p id="shareStatus"></p>
        </div>

    </section>

    <script src="./javascript/GSAP Plug-in's/gsap.min.js" defer></script>

    <script src="./javascript/GSAP Plug-in's/Draggable.min.js" defer></script>
    <script src="./javascript/GSAP Plug-in's/ScrollTrigger.min.js" defer></script>
    <script src="./javascript/GSAP Plug-in's/Flip.min.js" defer></script>

    <script src="./javascript/animations.js" defer></script>
    <script src="./javascript/try-on-page.js" defer></script>
    
</main>

</body>
</html>

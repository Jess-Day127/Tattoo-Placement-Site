<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon 2.png">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>
    <nav>
        <ul class="nav-links">
            <li><a href="./index.html">Home</a></li>
            <li><a href="./upload.html">Upload Design</a></li>
            <li><a href="/">Try-on</a></li>
        </ul>
    </nav>

<main>

    <section class="left-column">
        <div class="transform-tools">
            <h2>Transform</h2>
            <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
            <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
        </div>

        <div class="rotation-tools">
            <h2>Rotation</h2>
            <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
            <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
        </div>

        <div class="scale-tools">
            <h2>Scale</h2>
            <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
        </div>

        <div class="undo-redo">
            <h2>Undo/Redo</h2>
            <button id="undo-button">Undo</button>
            <button id="redo-button">Redo</button>
        </div>
    </section>

    <section class="try-on-container">
        <h2>Try On</h2>
        <div class="try-on-area">
            <img id="imgBodyArea" alt="Body area">
            <img id="imgStencil" alt="Your design">
        </div>
    </section>

    <section class="right-column">
        <div class="body-area-dropdown">
            <h2>Select Body Area</h2>
            <img src="" alt="Select Body Area" id="imgBodyAreaPreview">
            <select id="body-area-select" onchange="updateImage()">
                <option value="torso">Torso</option>
                <option value="back">Back</option>
                <option value="knuckles">Knuckles</option>
            </select>
        </div>

        <div class="skin-tone">
            <h2>Skin Tone</h2>
            <button onclick="changeSkinTone('light')">Light</button>
            <button onclick="changeSkinTone('medium')">Medium</button>
            <button onclick="changeSkinTone('dark')">Dark</button>
        </div>
    </section>


    <script src="./javascript/gsap.min.js" defer></script>

    <script src="./javascript/Flip.min.js" defer></script>
    <script src="./javascript/Draggable.min.js" defer></script>
    <script src="./javascript/ScrollTrigger.min.js" defer></script>

    <script src="./javascript/body.area.js" defer></script>
    <script src="./javascript/design.transform.js" defer></script>
    <script src="./javascript/gsap.js" defer></script>
    
</main>

<footer>
    <p>This is a virtual preview. Results may vary.</p>
    <p>&copy; 2026 X Mark's the Spot All rights reserved.</p>
</footer>

</body>
</html>

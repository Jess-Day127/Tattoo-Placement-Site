<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Mark's the Spot</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon 2.png">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <header>
        <h1>X Mark's the Spot</h1>
    </header>

    <main>    
        <section class="left-column">
            <div class="hero">
                <h2>Welcome to</h2>
                <h1>(Insert cool name here)</h1>
                <p> Cool description goes here...</p>
            </div>

            <div class="img-upload">
                <h2>Upload your Design</h2>
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <input type="file" name="image" accept="image/*" required>
                    <button type="submit">Upload</button>
                </form>
            </div>
        </section>

        <section class="right-column">
            <h2>Flash Wall</h2>
                <div class="flash-imgs">
                    <div class="flash-card">
                        <img src="flash1.jpg" alt="Flash 1">
                    </div>
                    <div class="flash-card">
                        <img src="flash2.jpg" alt="Flash 2">
                    </div>
                    <div class="flash-card">
                        <img src="flash3.jpg" alt="Flash 3">
                    </div>
                </div>
            <button type="button">View More Flash</button>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 (name)</p>
    </footer>

</body>
</html>
